name: CI

# Everything that gates a pull request, in one job sharing one install: Biome
# (lint + format), TypeScript, the workerd test suites, knip (dead code), and a
# wrangler deploy dry-run.
#
# Every check after the install runs even if an earlier one failed, so one red
# check doesn't hide the others -- a full picture per run rather than a
# fix-push-discover-the-next-one loop.
#
# It runs twice: on the pull request, where the `ci` job is the required check
# that gates the merge, and again on main afterwards. The second run is not the
# duplicate it looks like. A pull request is tested against the base it forked
# from, so two of them that pass separately can still break main together -- a
# rename in one, a new caller in the other -- and the merged commit is the
# first time that combination is built. It is also the only check here that
# does not depend on a repository setting staying as it is: if the ruleset on
# main is ever changed, relaxed or bypassed, this is what still reports.
#
# Nothing deploys from this workflow. Release Please (release-please.yml) also
# runs on pushes to main; the two share the event and duplicate nothing.
#
# A pull request cancels its own superseded runs, since only the tip is being
# gated. Pushes to main do not: each commit on main gets a finished run, which
# is what makes "main was green at this commit" a fact that can be looked up.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check (Biome)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test

      - name: Dead code detection (knip)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run dead-code

      - name: Deploy dry-run
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run build
